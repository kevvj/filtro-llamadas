<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filtro de llamadas - vista previa</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #101018; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; }
  .phone { position: relative; width: 390px; height: 820px; border-radius: 54px; background: #24243a; padding: 14px;
           box-shadow: 0 0 0 2px #34344a, 0 30px 80px #000a; }
  .phone::before { content: ""; position: absolute; top: 24px; left: 50%; transform: translateX(-50%); width: 110px; height: 28px;
                   background: #0b0e14; border-radius: 20px; z-index: 2; }
  .screen { width: 100%; height: 100%; border-radius: 42px; overflow: hidden; background: #171721; display: flex; flex-direction: column; }
  .bar { height: 46px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0; color: #EDEDF3; font-size: 14px; font-weight: 600; }
  iframe { flex: 1; width: 100%; border: 0; background: #171721; }
  .side { position: absolute; right: -4px; top: 170px; width: 4px; height: 90px; background: #34344a; border-radius: 0 3px 3px 0; }
  @media (max-height: 860px) { .phone { transform: scale(calc((100vh - 30px) / 820px)); } }
</style>
</head>
<body>
  <div class="phone"><div class="side"></div><div class="screen"><div class="bar"><span id="t"></span><span>5G &#9646;&#9646;&#9646; 87%</span></div><iframe src="http://localhost:8081"></iframe></div></div>
<script>const t=()=>document.getElementById("t").textContent=new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});t();setInterval(t,10000)</script>
</body>
</html>
