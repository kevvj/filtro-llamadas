name: APK

# Compila la APK en cada push a main y la publica en el release "latest".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dependencias
        run: npm ci

      - name: Revisar tipos
        run: npx tsc --noEmit

      - name: Generar proyecto Android
        run: npx expo prebuild -p android --no-install

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 --no-daemon

      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk filtro-llamadas.apk

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NOTES="Versión $VERSION (commit ${GITHUB_SHA::7}). Requiere Android 10 o superior."
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest filtro-llamadas.apk --title "Filtro de llamadas $VERSION" --notes "$NOTES" --latest
