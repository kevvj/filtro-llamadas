name: CI

# Revisa cada push y cada pull request. La APK solo se compila y publica si todas las revisiones pasan.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codigo:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # npm ci falla si package-lock.json no coincide con package.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Pruebas del filtro
        run: npm test

  seguridad:
    name: Secretos y dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Buscar contraseñas o llaves en el código
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Dependencias con fallos graves conocidos
        run: npm audit --omit=dev --audit-level=high
      - name: Dependencias nuevas peligrosas (solo en pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  apk:
    name: Compilar y publicar APK
    needs: [codigo, seguridad]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # versionCode de la APK: sube en cada ejecución (lo usa app.config.js y lo compara el actualizador)
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generar proyecto Android
        run: npx expo prebuild -p android --no-install
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 --no-daemon
      - name: Renombrar
        run: cp android/app/build/outputs/apk/release/app-release.apk filtro-llamadas.apk
      - name: Datos de la versión para el actualizador
        run: |
          node -e '
            const expo = require("./app.config.js")({ config: require("./app.json").expo })
            const code = expo.android.versionCode
            const info = {
              versionCode: code,
              version: expo.version,
              url: "https://github.com/" + process.env.GITHUB_REPOSITORY + "/releases/download/latest/filtro-llamadas.apk?v=" + code,
            }
            require("fs").writeFileSync("version.json", JSON.stringify(info, null, 2))
            console.log(info)
          '
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./version.json').version")
          NOTES="Versión $VERSION (commit ${GITHUB_SHA::7}). Requiere Android 10 o superior. La app se actualiza sola."
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest filtro-llamadas.apk version.json --title "Filtro de llamadas $VERSION" --notes "$NOTES" --latest
